                    <td class="ar-text">
                        <div class="word-wrapper"><span class="clickable-word" onclick="showOpposite('${item.ar}')">${item.ar}</span><span class="speak-icon" onclick="speakWord('${item.ar}', 'ar')">🔊</span></div> / 
                        <div class="word-wrapper"><span class="clickable-word" onclick="showOpposite('${item.arOpp}')" style="color: #e43f5a;">${item.arOpp}</span><span class="speak-icon" onclick="speakWord('${item.arOpp}', 'ar')">🔊</span></div>
                    </td>
                    <td class="en-fr-text">
                        <div class="word-wrapper"><span class="clickable-word" onclick="showOpposite('${item.fr}')">${item.fr}</span><span class="speak-icon" onclick="speakWord('${item.fr}', 'fr')">🔊</span></div> / 
                        <div class="word-wrapper"><span class="clickable-word" onclick="showOpposite('${item.frOpp}')" style="color: #ff476f;">${item.frOpp}</span><span class="speak-icon" onclick="speakWord('${item.frOpp}', 'fr')">🔊</span></div>
                    </td>
                    <td class="en-fr-text">
                        <div class="word-wrapper"><span class="clickable-word" onclick="showOpposite('${item.en}')">${item.en}</span><span class="speak-icon" onclick="speakWord('${item.en}', 'en')">🔊</span></div> / 
                        <div class="word-wrapper"><span class="clickable-word" onclick="showOpposite('${item.enOpp}')" style="color: #4ecc6d;">${item.enOpp}</span><span class="speak-icon" onclick="speakWord('${item.enOpp}', 'en')">🔊</span></div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tableRows.filter(item => 
                item.ar.toLowerCase().includes(query) || item.arOpp.toLowerCase().includes(query) ||
                item.fr.toLowerCase().includes(query) || item.frOpp.toLowerCase().includes(query) ||
                item.en.toLowerCase().includes(query) || item.enOpp.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        function speakWord(word, langCode) {
            if (langCode === 'ar') {
                const audio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(word)}&tl=ar&client=tw-ob`);
                audio.play().catch(e => console.log("Audio play error:", e));
            } else {
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(word);
                    utterance.lang = langCode === 'fr' ? 'fr-FR' : 'en-US';
                    window.speechSynthesis.speak(utterance);
                }
            }
        }

        function showOpposite(word) {
            const modal = document.getElementById('modalOverlay');
            const titleEl = document.getElementById('modalTitle');
            const textEl = document.getElementById('modalText');

            if (detailsMap[word]) {
                titleEl.innerText = detailsMap[word].msg + ` "${word}"`;
                textEl.innerText = detailsMap[word].opp;
            } else {
                titleEl.innerText = `الكلمة: "${word}"`;
                textEl.innerText = "---";
            }
            modal.classList.add('active');
        }

        function closeModalDirect() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function closeModal(event) {
            if (event.target.id === 'modalOverlay') {
                closeModalDirect();
            }
        }

        let currentScore = 0;
        let currentQuizCorrect = "";

        function startQuiz() {
            currentScore = 0;
            document.getElementById('quizScore').innerText = `النقاط: ${currentScore}`;
            document.getElementById('quizModalOverlay').classList.add('active');
            nextQuizQuestion();
        }

        function nextQuizQuestion() {
            const keys = Object.keys(detailsMap);
            const randomKey = keys[Math.floor(Math.random() * keys.length)];
            currentQuizCorrect = detailsMap[randomKey].opp;

            document.getElementById('quizQuestionText').innerText = `ما هو ضد الكلمة: "${randomKey}"؟`;

            let options = [currentQuizCorrect];
            while (options.length < 3) {
                const randomWrong = keys[Math.floor(Math.random() * keys.length)];
                const wrongOpp = detailsMap[randomWrong].opp;
                if (!options.includes(wrongOpp)) {
                    options.push(wrongOpp);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quizOptionsContainer');
            optionsContainer.innerHTML = "";
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkQuizAnswer(opt);
                optionsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(selected) {
            if (selected === currentQuizCorrect) {
                currentScore += 10;
                document.getElementById('quizScore').innerText = `النقاط: ${currentScore} (أحسنت! ✅)`;
                setTimeout(nextQuizQuestion, 800);
            } else {
                document.getElementById('quizScore').innerText = `النقاط: ${currentScore} (خطأ، حاول مجدداً ❌)`;
            }
        }

        function closeQuizModal() {
            document.getElementById('quizModalOverlay').classList.remove('active');
        }

        window.onload = () => renderTable();
    </script>
</body>
</html>
