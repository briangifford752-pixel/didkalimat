<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تعلم الأفعال - 50 فعل</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #22c55e;
            --danger: #ef4444;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 20px;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .nav-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .nav-btn {
            background-color: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        main {
            flex: 1;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .app-section {
            display: none;
        }

        .app-section.active {
            display: block;
        }

        /* Verbs Section */
        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        @media (min-width: 768px) {
            .controls-bar {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }

        .search-input {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 350px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .categories-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .verb-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .verb-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }

        .verb-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .verb-name-fr {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent);
        }

        .group-tag {
            font-size: 0.75rem;
            background-color: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .card-details-preview {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 90%;
            max-width: 650px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            left: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .close-modal:hover {
            color: var(--danger);
        }

        .modal-header {
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .info-section {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 10px;
            border-radius: 6px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 0.95rem;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-row span {
            color: var(--text-muted);
        }

        /* Quiz & Typing Sections */
        .quiz-container, .typing-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 20px;
        }

        .quiz-option-btn {
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .quiz-option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background-color: rgba(59, 130, 246, 0.05);
        }

        .quiz-option-btn.correct {
            background-color: rgba(34, 197, 94, 0.2);
            border-color: var(--success);
            color: #4ade80;
        }

        .quiz-option-btn.wrong {
            background-color: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: #f87171;
        }

        .action-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .score-display {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: var(--success);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header>
        <h1>قاموس الأفعال الفرنسية والإنجليزية</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">قاعدة بيانات شاملة تحتوي على 50 فعلاً مع التصريفات والمعاني</p>
        <div class="nav-container">
            <button class="nav-btn active" onclick="switchSection('verbs', this)">القاموس والأفعال</button>
            <button class="nav-btn" onclick="switchSection('quiz', this)">اختبار المعاني</button>
            <button class="nav-btn" onclick="switchSection('typing', this)">تحدي الكتابة والإملاء</button>
        </div>
    </header>

    <main>
        <!-- Verbs Section -->
        <section id="verbsSection" class="app-section active">
            <div class="controls-bar">
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث بالعربية، الفرنسية، أو الإنجليزية..." oninput="filterVerbs()">
                <div class="categories-tabs">
                    <button class="tab-btn active" onclick="setCategory('all', this)">الكل (50)</button>
                    <button class="tab-btn" onclick="setCategory('movement', this)">الحركة</button>
                    <button class="tab-btn" onclick="setCategory('mind', this)">التفكير والإدراك</button>
                    <button class="tab-btn" onclick="setCategory('communication', this)">التواصل</button>
                    <button class="tab-btn" onclick="setCategory('daily', this)">أفعال يومية</button>
                </div>
            </div>
            <div id="verbGrid" class="verb-grid">
                <!-- Dynamic Content -->
            </div>
        </section>

        <!-- Quiz Section -->
        <section id="quizSection" class="app-section">
            <div class="quiz-container">
                <div id="quizScore" class="score-display">النقاط: 0</div>
                <h3 id="quizQuestion" style="font-size: 1.2rem; margin-bottom: 15px;">جاري تحميل السؤال...</h3>
                <div id="quizOptions" class="quiz-options"></div>
                <button id="nextQuizBtn" class="action-btn" style="display: none;" onclick="loadNewQuestion()">السؤال الموالي</button>
            </div>
        </section>

        <!-- Typing Section -->
        <section id="typingSection" class="app-section">
            <div class="typing-container">
                <div id="typingScore" class="score-display">النقاط الإملائية: 0</div>
                <h3 id="typingPrompt" style="font-size: 1.2rem; margin-bottom: 15px;">جاري التحميل...</h3>
                <input type="text" id="typingInput" class="search-input" style="max-width: 100%; text-align: center; margin-bottom: 10px;" placeholder="اكتب الفعل بالفرنسية هنا واضغط Enter..." onkeydown="checkTyping(event)">
                <p id="typingFeedback" style="font-weight: bold; min-height: 25px;"></p>
                <button id="nextTypingBtn" class="action-btn" style="display: none;" onclick="loadNewTypingChallenge()">التحدي الموالي</button>
            </div>
        </section>
    </main>

    <!-- Modal details -->
    <div id="verbModal" class="modal-overlay" onclick="closeModalOnOutside(event)">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <h2 id="modalTitle">عنوان الفعل</h2>
                <span id="modalBadge" class="group-tag">المجموعة</span>
            </div>
            <div id="modalTranslations" class="info-section"></div>
            <div id="modalConjugationFr" class="info-section"></div>
            <div id="modalConjugationEn" class="info-section"></div>
            <div id="modalForms" class="info-section"></div>
            <div class="info-section">
                <div style="font-weight: 600; color: var(--accent); margin-bottom: 6px;">مثال توضيحي (Example):</div>
                <p id="modalExample" style="font-size: 0.950rem; color: var(--text-main);"></p>
            </div>
        </div>
    </div>

    <script>
        const verbsDatabase = [
            // الأفعال 30 الأولى الأصلية
            { 
                id: 1, category: "movement", group: "المجموعة الأولى", french: "Aller", english: "To go", arabic: "ذهب / يذهب", 
                translations: { "العربية": "ذهب / يذهب", "الفرنسية": "Aller", "الإنجليزية": "To go" }, 
                conjugationFr: { 
                    "Présent (المضارع)": "Je vais, Tu vas, Il/Elle va, Nous allons, Vous allez, Ils/Elles vont", 
                    "Passé Composé (الماضي)": "Je suis allé(e), Tu es allé(e), Il est allé, Nous sommes allé(e)s, Vous êtes allé(e)s, Ils sont allés", 
                    "Futur (المستقبل)": "J'irai, Tu iras, Il ira, Nous irons, Vous irez, Ils iront" 
                }, 
                conjugationEn: { 
                    "Present (المضارع)": "I go, You go, He/She/It goes, We go, You go, They go", 
                    "Past Simple (الماضي البسيط)": "I went, You went, He/She/It went, We went, You went, They went", 
                    "Future (المستقبل)": "I will go, You will go, He/She/It will go, We will go, You will go, They will go" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je ne vais pas | EN: I don't go (أنا لا أذهب)",
                    "السؤال (Interrogation)": "FR: Vas-tu ? | EN: Do you go? (هل تذهب؟)",
                    "الأمر (Impératif)": "FR: Va ! | EN: Go! (اذهب!)"
                },
                example: "مثال (FR): Je vais au travail. | (EN): I go to work." 
            },
            { 
                id: 2, category: "mind", group: "المجموعة الأولى", french: "Aimer", english: "To like / To love", arabic: "أحب / يحب", 
                translations: { "العربية": "أحب / يحب", "الفرنسية": "Aimer", "الإنجليزية": "To like / To love" }, 
                conjugationFr: { 
                    "Présent (المضارع)": "J'aime, Tu aimes, Il/Elle aime, Nous aimons, Vous aimez, Ils/Elles aiment", 
                    "Passé Composé (الماضي)": "J'ai aimé, Tu as aimé, Il a aimé, Nous avons aimé, Vous avez aimé, Ils ont aimé", 
                    "Futur (المستقبل)": "J'aimerai, Tu aimeras, Il aimera, Nous aimerons, Vous aimerez, Ils aimeront" 
                }, 
                conjugationEn: { 
                    "Present (المضارع)": "I like, You like, He/She/It likes, We like, You like, They like", 
                    "Past Simple (الماضي البسيط)": "I liked, You liked, He/She/It liked, We liked, You liked, They liked", 
                    "Future (المستقبل)": "I will like, You will like, He/She/It will like, We will like, You will like, They will like" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je n'aime pas | EN: I don't like (أنا لا أحب)",
                    "السؤال (Interrogation)": "FR: Aimes-tu ? | EN: Do you like? (هل تحب؟)",
                    "الأمر (Impératif)": "FR: Aime ! | EN: Like! (أحب!)"
                },
                example: "مثال (FR): J'aime le chocolat. | (EN): I like chocolate." 
            },
            { 
                id: 3, category: "communication", group: "المجموعة الثالثة", french: "Avoir", english: "To have", arabic: "تملك / لديه", 
                translations: { "العربية": "تملك / لديه", "الفرنسية": "Avoir", "الإنجليزية": "To have" }, 
                conjugationFr: { 
                    "Présent (المضارع)": "J'ai, Tu as, Il/Elle a, Nous avons, Vous avez, Ils/Elles ont", 
                    "Passé Composé (الماضي)": "J'ai eu, Tu as eu, Il a eu, Nous avons eu, Vous avez eu, Ils ont eu", 
                    "Futur (المستقبل)": "J'aurai, Tu auras, Il aura, Nous aurons, Vous aurez, Ils auront" 
                }, 
                conjugationEn: { 
                    "Present (المضارع)": "I have, You have, He/She/It has, We have, You have, They have", 
                    "Past Simple (الماضي البسيط)": "I had, You had, He/She/It had, We had, You had, They had", 
                    "Future (المستقبل)": "I will have, You will have, He/She/It will have, We will have, You will have, They will have" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je n'ai pas | EN: I don't have (ليس لدي)",
                    "السؤال (Interrogation)": "FR: As-tu ? | EN: Do you have? (هل لديك؟)",
                    "الأمر (Impératif)": "FR: Aie ! | EN: Have! (املك!)"
                },
                example: "مثال (FR): J'ai une voiture. | (EN): I have a car." 
            },
            { 
                id: 4, category: "communication", group: "المجموعة الثالثة", french: "Être", english: "To be", arabic: "كان / يكون", 
                translations: { "العربية": "كان / يكون", "الفرنسية": "Être", "الإنجليزية": "To be" }, 
                conjugationFr: { 
                    "Présent (المضارع)": "Je suis, Tu es, Il/Elle est, Nous sommes, Vous êtes, Ils/Elles sont", 
                    "Passé Composé (الماضي)": "J'ai été, Tu as été, Il a été, Nous avons été, Vous avez été, Ils ont été",

                conjugationEn: {

                forms: {

                    "السؤال (Interrogation)": "FR: Es-tu ? | EN: Are you? (هل أنت؟)",
                    "الأمر (Impératif)": "FR: Sois ! | EN: Be! (كن!)"
                },
                example: "مثال (FR): Je suis heureux. | (EN): I am happy." 
            },
            { 
                id: 5, category: "daily", group: "المجموعة الثالثة", french: "Faire", english: "To do / To make", arabic: "فعل / يصنع", 
                translations: { "العربية": "فعل / يصنع", "الفرنسية": "Faire", "الإنجليزية": "To do / To make" },

                    "Présent (المضارع)": "Je fais, Tu fais, Il/Elle fait, Nous faisons, Vous faites, Ils/Elles font",

                    "Futur (المستقبل)": "Je ferai, Tu feras, Il fera, Nous ferons, Vous ferez, Ils feront"

                conjugationEn: { 
                    "Present (المضارع)": "I do, You do, He/She/It does, We do, You do, They do", 
                    "Past Simple (الماضي البسيط)": "I did, You did, He/She/It did, We did, You did, They did", 
                    "Future (المستقبل)": "I will do, You will do, He/She/It will do, We will do, You will do, They will do" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je ne fais pas | EN: I don't do (أنا لا أفعله)",
                    "السؤال (Interrogation)": "FR: Fais-tu ? | EN: Do you do? (هل تفعل؟)",
                    "الأمر (Impératif)": "FR: Fais ! | EN: Do! (افعل!)"
                },
                example: "مثال (FR): Je fais mes devoirs. | (EN): I do my homework." 
            },
            { 
                id: 6, category: "communication", group: "المجموعة الثالثة", french: "Dire", english: "To say", arabic: "قال / يقول", 
                translations: { "العربية": "قال / يقول", "الفرنسية": "Dire", "الإنجليزية": "To say" }, 
                conjugationFr: { 
                    "Présent (المضارع)": "Je dis, Tu dis, Il/Elle dit, Nous disons, Vous dites, Ils/Elles disent", 
                    "Passé Composé (الماضي)": "J'ai dit, Tu as dit, Il a dit, Nous avons dit, Vous avez dit, Ils ont dit", 
                    "Futur (المستقبل)": "Je dirai, Tu diras, Il dira, Nous dirons, Vous direz, Ils diront" 
                }, 
                conjugationEn: { 
                    "Present (المضارع)": "I say, You say, He/She/It says, We say, You say, They say", 
                    "Past Simple (الماضي البسيط)": "I said, You said, He/She/It said, We said, You said, They said", 
                    "Future (المستقبل)": "I will say, You will say, He/She/It will say, We will say, You will say, They will say" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je ne dis pas | EN: I don't say (أنا لا أقول)",
                    "السؤال (Interrogation)": "FR: Dis-tu ? | EN: Do you say? (هل تقول؟)",
                    "الأمر (Impératif)": "FR: Dis ! | EN: Say! (قل!)"
                },
                example: "مثال (FR): Je dis la vérité. | (EN): I say the truth." 
            },
            { 
                id: 7, category: "mind", group: "المجموعة الثالثة", french: "Pouvoir", english: "To can / To be able to", arabic: "استطاع / يقدر", 
                translations: { "العربية": "استطاع / يقدر", "الفرنسية": "Pouvoir", "الإنجليزية": "To can" }, 
                conjugationFr: { 
                    "Présent (المضارع)": "Je peux, Tu peux, Il/Elle peut, Nous pouvons, Vous pouvez, Ils/Elles peuvent", 
                    "Passé Composé (الماضي)": "J'ai pu, Tu as pu, Il a pu, Nous avons pu, Vous avez pu, Ils ont pu", 
                    "Futur (المستقبل)": "Je pourrai, Tu pourras, Il pourra, Nous pourrons, Vous pourrez, Ils pourront" 
                }, 
                conjugationEn: { 
                    "Present (المضارع)": "I can, You can, He/She/It can, We can, You can, They can", 
                    "Past Simple (الماضي البسيط)": "I could, You could, He/She/It could, We could, You could, They could", 
                    "Future (المستقبل)": "I will be able to, You will be able to, He/She/It will be able to, We will be able to, You will be able to, They will be able to" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je ne peux pas | EN: I cannot (لا أستطيع)",
                    "السؤال (Interrogation)": "FR: Peux-tu ? | EN: Can you? (هل تستطيع؟)",
                    "الأمر (Impératif)": "FR: غير متوفر | EN: غير متوفر"
                },
                example: "مثال (FR): Je peux le faire. | (EN): I can do it."

                    "Présent (المضارع)": "Je nettoie, Tu nettoies, Il/Elle nettoie, Nous nettoyons, Vous nettoyez, Ils/Elles nettoient", 
                    "Passé Composé (الماضي)": "J'ai nettoyé, Tu as nettoyé, Il a nettoyé, Nous avons nettoyé, Vous avez nettoyé, Ils ont nettoyé", 
                    "Futur (المستقبل)": "Je nettoierai, Tu nettoieras, Il nettoiera, Nous nettoierons, Vous nettoierez, Ils nettoieront" 
                }, 
                conjugationEn: { 
                    "Present (المضارع)": "I clean, You clean, He/She/It cleans, We clean, You clean, They clean", 
                    "Past Simple (الماضي البسيط)": "I cleaned, You cleaned, He/She/It cleaned, We cleaned, You cleaned, They cleaned", 
                    "Future (المستقبل)": "I will clean, You will clean, He/She/It will clean, We will clean, You will clean, They will clean" 
                }, 
                forms: {
                    "النفي (Négation)": "FR: Je ne nettoie pas | EN: I don't clean (لا أنظف)",
                    "السؤال (Interrogation)": "FR: Nettoies-tu ? | EN: Do you clean? (هل تنظف؟)",
                    "الأمر (Impératif)": "FR: Nettoie ! | EN: Clean! (نظف!)"
                },
                example: "مثال (FR): Je nettoie la chambre. | (EN): I clean the room." 
            }
        ];

        let currentCategory = 'all';
        let quizScoreCount = 0;
        let typingScoreCount = 0;
        let currentQuizVerb = null;
        let currentTypingVerb = null;

        window.onload = function() {
            renderVerbs(verbsDatabase);
        };

        function switchSection(sectionId, btnElement) {
            document.querySelectorAll('.app-section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(sectionId + 'Section').classList.add('active');
            btnElement.classList.add('active');

            if (sectionId === 'quiz') {
                loadNewQuestion();
            } else if (sectionId === 'typing') {
                loadNewTypingChallenge();
            }
        }

        function renderVerbs(list) {
            const grid = document.getElementById('verbGrid');
            grid.innerHTML = '';
            
            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; padding: 30px; color: var(--text-muted);">عذراً، لم يتم العثور على نتائج مطابقة لبحثك.</p>';
                return;
            }

            list.forEach(verb => {
                const card = document.createElement('div');
                card.className = 'verb-card';
                card.onclick = () => openVerbModal(verb);
                
                card.innerHTML = `
                    <div class="card-top">
                        <span class="verb-name-fr">${verb.french}</span>
                        <span class="group-tag">${verb.group}</span>
                    </div>
                    <div class="card-details-preview">
                        <div>EN: <span>${verb.english}</span></div>
                        <div>AR: <span>${verb.arabic}</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function setCategory(cat, btnElement) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            filterVerbs();
        }

        function filterVerbs() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            const filtered = verbsDatabase.filter(verb => {
                const matchesCategory = (currentCategory === 'all' || verb.category === currentCategory);
                const matchesQuery = query === '' || 
                    verb.french.toLowerCase().includes(query) || 
                    verb.english.toLowerCase().includes(query) || 
                    verb.arabic.toLowerCase().includes(query);
                
                return matchesCategory && matchesQuery;
            });

            renderVerbs(filtered);
        }

        function openVerbModal(verb) {
            document.getElementById('modalTitle').innerText = `${verb.french} - ${verb.arabic}`;
            document.getElementById('modalBadge').innerText = verb.group;

            const transBox = document.getElementById('modalTranslations');
            transBox.innerHTML = `
                <div class="info-row"><span>الفرنسية:</span> <strong>${verb.translations["الفرنسية"]}</strong></div>
                <div class="info-row"><span>الإنجليزية:</span> <strong>${verb.translations["الإنجليزية"]}</strong></div>
                <div class="info-row"><span>العربية:</span> <strong>${verb.translations["العربية"]}</strong></div>
            `;

            const frBox = document.getElementById('modalConjugationFr');
            let frHtml = '<div style="font-weight: 600; color: var(--accent); margin-bottom: 6px;">تصريف الفرنسية (Conjugaison Française):</div>';
            for (let [tense, conj] of Object.entries(verb.conjugationFr)) {
                frHtml += `<div class="info-row"><span>${tense}</span> <strong>${conj}</strong></div>`;
            }
            frBox.innerHTML = frHtml;

            const enBox = document.getElementById('modalConjugationEn');
            let enHtml = '<div style="font-weight: 600; color: var(--accent); margin-bottom: 6px;">تصريف الإنجليزية (English Conjugation):</div>';
            for (let [tense, conj] of Object.entries(verb.conjugationEn)) {
                enHtml += `<div class="info-row"><span>${tense}</span> <strong>${conj}</strong></div>`;
            }
            enBox.innerHTML = enHtml;

            const formsBox = document.getElementById('modalForms');
            let formsHtml = '';
            for (let [formName, formVal] of Object.entries(verb.forms)) {
                formsHtml += `<div class="info-row"><span>${formName}</span> <strong>${formVal}</strong></div>`;
            }
            formsBox.innerHTML = formsHtml;

            document.getElementById('modalExample').innerText = verb.example;
            document.getElementById('verbModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('verbModal').classList.remove('active');
        }

        function closeModalOnOutside(event) {
            if (event.target.id === 'verbModal') {
                closeModal();
            }
        }

        function loadNewQuestion() {
            document.getElementById('nextQuizBtn').style.display = 'none';
            const randomIndex = Math.floor(Math.random() * verbsDatabase.length);
            currentQuizVerb = verbsDatabase[randomIndex];

            document.getElementById('quizQuestion').innerText = `ما هي الترجمة الصحيحة للفعل الفرنسي: "${currentQuizVerb.french}"؟`;

            let options = [currentQuizVerb.arabic];
            while (options.length < 3) {
                const randVerb = verbsDatabase[Math.floor(Math.random() * verbsDatabase.length)];
                if (!options.includes(randVerb.arabic)) {
                    options.push(randVerb.arabic);
                }
            }
            options.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkQuizAnswer(opt, btn);
                optionsContainer.appendChild(btn);
            });
        }

        function checkQuizAnswer(selectedOption, btnElement) {
            const allBtns = document.querySelectorAll('.quiz-option-btn');
            allBtns.forEach(b => b.disabled = true);

            if (selectedOption === currentQuizVerb.arabic) {
                btnElement.classList.add('correct');
                quizScoreCount += 10;
                document.getElementById('quizScore').innerText = `النقاط: ${quizScoreCount}`;
            } else {
                btnElement.classList.add('wrong');
                allBtns.forEach(b => {
                    if (b.innerText === currentQuizVerb.arabic) b.classList.add('correct');
                });
            }
            document.getElementById('nextQuizBtn').style.display = 'inline-block';
        }

        function loadNewTypingChallenge() {
            document.getElementById('nextTypingBtn').style.display = 'none';
            document.getElementById('typingInput').value = '';
            document.getElementById('typingInput').disabled = false;
            document.getElementById('typingFeedback').innerText = '';
            
            const randomIndex = Math.floor(Math.random() * verbsDatabase.length);
            currentTypingVerb = verbsDatabase[randomIndex];
            document.getElementById('typingPrompt').innerText = `اكتب الفعل باللغة الفرنسية لـ: "${currentTypingVerb.arabic}" (${currentTypingVerb.english})`;
            document.getElementById('typingInput').focus();
        }

        function checkTyping(event) {
            if (event.key === 'Enter') {
                const userVal = document.getElementById('typingInput').value.trim();
                const feedback = document.getElementById('typingFeedback');
                
                if (userVal.toLowerCase() === currentTypingVerb.french.toLowerCase()) {
                    feedback.style.color = '#34d399';
                    feedback.innerText = 'إجابة صحيحة وصناعة رائعة!';
                    typingScoreCount += 15;
                    document.getElementById('typingScore').innerText = `النقاط الإملائية: ${typingScoreCount}`;
                    document.getElementById('typingInput').disabled = true;
                    document.getElementById('nextTypingBtn').style.display = 'inline-block';
                } else {
                    feedback.style.color = '#f87171';
                    feedback.innerText = `خطأ! الإجابة الصحيحة هي: ${currentTypingVerb.french}`;
                    document.getElementById('typingInput').disabled = true;
                    document.getElementById('nextTypingBtn').style.display = 'inline-block';
                }
            }
        }
    </script>
</body>
</html>
